aid: vicinity-centres

name: Vicinity Centres

description: 'Vicinity Centres (ASX: VCX; legal entity Vicinity Centres Pty. Ltd.) is an Australian retail property owner and manager whose portfolio of retail-led destinations ranges from premium centres such as Chadstone and Queen Victoria Building to DFO outlets and local neighbourhood centres. Its site describes in-house data science and strategic insights teams that support data-led leasing, plus retail solutions covering advertising, brand activations and pop-up retail. Retail partners use the Vicinity Connect retailer portal (portal.vicinity.com.au), which requires an invite and login; no public developer documentation or API reference was found on its sites.'

